name: relay

x-node-env: &node-env
  DATABASE_URL: postgres://relay:relay@postgres:5432/relay
  REDIS_URL: redis://redis:6379

x-node-service: &node-service
  image: relay-node:local
  restart: unless-stopped

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: relay
      POSTGRES_PASSWORD: relay
      POSTGRES_DB: relay
    ports: ["55432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relay"]
      interval: 2s
      retries: 30

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["56379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 30

  migrate:
    <<: *node-service
    build: { context: ., target: runtime }
    command: ["node", "apps/api/dist/migrate.js"]
    restart: "no"
    environment: *node-env
    depends_on:
      postgres: { condition: service_healthy }

  api:
    <<: *node-service
    command: ["node", "apps/api/dist/index.js"]
    environment:
      <<: *node-env
      PORT: "3000"
      DEMO_API_KEY: ${DEMO_API_KEY:-rk_demo_7f3c9a1e5b2d4f6a8c0e}
      RECEIVER_SECRET: ${RECEIVER_SECRET:-whsec_ZGVtby1zZWNyZXQtZm9yLWxvY2FsLXVzZS1vbmx5}
      DEMO_ENDPOINTS: "http://receiver:4000/hooks/billing=invoice.paid,invoice.failed;http://receiver:4000/hooks/crm=*"
    ports: ["3000:3000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 3s
      retries: 20

  worker:
    <<: *node-service
    command: ["node", "apps/worker/dist/index.js"]
    environment:
      <<: *node-env
      WORKER_CONCURRENCY: "50"
      MAX_ATTEMPTS: "10"
      BACKOFF_BASE_MS: "500"
      BACKOFF_CAP_MS: "30000"
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9100/health"]
      interval: 3s
      retries: 20

  receiver:
    <<: *node-service
    command: ["node", "apps/receiver/dist/index.js"]
    environment:
      PORT: "4000"
      RECEIVER_SECRET: ${RECEIVER_SECRET:-whsec_ZGVtby1zZWNyZXQtZm9yLWxvY2FsLXVzZS1vbmx5}
    ports: ["4000:4000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/health"]
      interval: 3s
      retries: 20

  dashboard:
    build:
      context: .
      target: dashboard
      args:
        VITE_DEMO_API_KEY: ${DEMO_API_KEY:-rk_demo_7f3c9a1e5b2d4f6a8c0e}
    ports: ["8088:80"]
    depends_on:
      api: { condition: service_healthy }

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes: ["./infra/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:11.3.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/provisioning/dashboards/relay.json
    volumes: ["./infra/grafana/provisioning:/etc/grafana/provisioning:ro"]
    ports: ["3001:3000"]
    depends_on: [prometheus]

  k6:
    image: grafana/k6:0.55.0
    profiles: [loadtest]
    volumes: ["./scripts:/scripts:ro"]
    command: ["run", "/scripts/load.js"]
    environment:
      API_URL: http://api:3000
      API_KEY: ${DEMO_API_KEY:-rk_demo_7f3c9a1e5b2d4f6a8c0e}
      EVENTS: ${EVENTS:-10000}
      VUS: ${VUS:-50}
    depends_on:
      api: { condition: service_healthy }

volumes:
  pgdata:
