server {
  listen 80;
  root /usr/share/nginx/html;

  # Resolve upstreams at request time through Docker's DNS, so recreating the
  # api/receiver containers (new IPs) doesn't leave nginx pointing at stale addresses.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api_upstream http://api:3000;
  set $receiver_upstream http://receiver:4000;

  location /api/ {
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;          # required for Server-Sent Events
    proxy_read_timeout 1h;
  }

  location /receiver/ {
    rewrite ^/receiver/(.*)$ /$1 break;
    proxy_pass $receiver_upstream;
  }

  location / {
    try_files $uri /index.html;
  }
}
